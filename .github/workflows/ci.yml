name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker build -t kubernetes-backend-deployment:ci .

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests offline
        run: |
          docker run --rm \
            -v "$PWD/k8s:/manifests:ro" \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict \
            -summary \
            /manifests
